
name: Deploy to Production

on:
  push:
    branches:
      - prod

  pull_request:
    branches:
      - prod
    types:
      - closed

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE: dsdantasurakshafds/dantsurakshak-app:prod

jobs:

  # ==========================================
  # JOB 1: CHECK DEPLOYMENT CONDITION
  # ==========================================

  check-merge:
    name: Check Deploy Condition
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - name: Check deploy condition
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Direct push to prod - deploying."

          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "PR merged into prod - deploying."

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - deploying."

          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "PR closed without merging - skipping."
          fi

  # ==========================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    needs: check-merge

    if: needs.check-merge.outputs.should_deploy == 'true'

    steps:

      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ env.DOCKER_IMAGE }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  # ==========================================
  # JOB 3: DEPLOY TO VPS
  # ==========================================

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: prod

      # --------------------------------------
      # STEP 1: CHECK VPS CONNECTION
      # --------------------------------------

      - name: Test VPS SSH Connectivity
        shell: bash
        run: |
          echo "Checking VPS SSH connectivity..."

          nc -vz -w 10 \
            "${{ secrets.VPS_HOST }}" \
            "${{ secrets.VPS_PORT }}"

          echo "VPS SSH port is reachable."

      # --------------------------------------
      # STEP 2: COPY DOCKER COMPOSE FILE
      # --------------------------------------

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          source: "docker-compose.yml"
          target: "/home/rdeveloper/dantsurakshak-web-app"

          timeout: 60s
          command_timeout: 10m
          overwrite: true

      # --------------------------------------
      # STEP 3: DEPLOY APPLICATION
      # --------------------------------------

      - name: Pull Image & Restart Containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPERADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_SUPERADMIN_EMAIL }}
          GMAIL: ${{ secrets.GMAIL }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          timeout: 60s
          command_timeout: 10m

          envs: MONGODB_URI,NEXTAUTH_SECRET,NEXTAUTH_URL,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_SUPERADMIN_EMAIL,GMAIL,GMAIL_PASS,FIREBASE_SERVICE_ACCOUNT,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |
            set -e

            echo "================================"
            echo "Starting Production Deployment"
            echo "================================"

            cd /home/rdeveloper/dantsurakshak-web-app

            # --------------------------------
            # CREATE PRODUCTION ENV FILE
            # --------------------------------

            umask 077

            cat > .env <<'ENVEOF'
            NODE_ENV=production
            IMAGE_TAG=prod
            ENVEOF

            printf 'MONGODB_URI=%s\n' "$MONGODB_URI" >> .env
            printf 'NEXTAUTH_SECRET=%s\n' "$NEXTAUTH_SECRET" >> .env
            printf 'NEXTAUTH_URL=%s\n' "$NEXTAUTH_URL" >> .env
            printf 'NEXT_PUBLIC_API_URL=%s\n' "$NEXT_PUBLIC_API_URL" >> .env
            printf 'NEXT_PUBLIC_SUPERADMIN_EMAIL=%s\n' "$NEXT_PUBLIC_SUPERADMIN_EMAIL" >> .env
            printf 'GMAIL=%s\n' "$GMAIL" >> .env
            printf 'GMAIL_PASS=%s\n' "$GMAIL_PASS" >> .env

            # Firebase service account
            printf 'FIREBASE_SERVICE_ACCOUNT=%s\n' "$FIREBASE_SERVICE_ACCOUNT" >> .env

            echo "Production environment configured."

            # --------------------------------
            # LOGIN TO DOCKER HUB
            # --------------------------------

            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

            echo "Docker Hub login successful."

            # --------------------------------
            # PULL LATEST PRODUCTION IMAGE
            # --------------------------------

            echo "Pulling latest Docker image..."

            docker compose pull

            # --------------------------------
            # RESTART PRODUCTION CONTAINERS
            # --------------------------------

            echo "Restarting production containers..."

            docker compose up -d \
              --force-recreate \
              --remove-orphans

            # --------------------------------
            # VERIFY DEPLOYMENT
            # --------------------------------

            echo "Checking running containers..."

            docker compose ps

            # --------------------------------
            # DOCKER LOGIN CLEANUP
            # --------------------------------

            docker logout || true

            echo "================================"
            echo "Production Deployment Completed"
            echo "================================"
