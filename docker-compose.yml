version: "3.9"

services:
  nextjs:
    image: dsdantasurakshafds/dantsurakshak-app:prod
    container_name: dantsurakshak_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app_network:
    driver: bridge